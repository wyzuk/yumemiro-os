# ==============================================================================
# Yumemiro OS - Calamares Installer Settings
# ==============================================================================

modules-search: [ local ]

instances:
- id:       yumemiro
  module:   welcome
  config:   welcome.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - networkcfg
  - hwclock
  - displaymanager
  - networkmanager
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: yumemiro
prompt-at-end: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
