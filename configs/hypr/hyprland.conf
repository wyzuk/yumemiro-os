# ==============================================================================
# Yumemiro OS - Hyprland Configuration
# Design Language: Glassmorphism, 24px Rounded Corners, Pastel Purple/Pink
# ==============================================================================

# ------------------------------------------------------------------------------
# AUTOSTART
# ------------------------------------------------------------------------------
exec-once = waybar &
exec-once = hyprpaper &
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = dunst -config ~/.config/dunst/dunstrc &
exec-once = yumemiro-welcome --autostart &

# ------------------------------------------------------------------------------
# ENVIRONMENT VARIABLES
# ------------------------------------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Yumemiro-Pastel
env = QT_QPA_PLATFORMTHEME,qt5ct

# ------------------------------------------------------------------------------
# MONITOR CONFIGURATION
# ------------------------------------------------------------------------------
monitor=,preferred,auto,1

# ------------------------------------------------------------------------------
# INPUT CONFIGURATION
# ------------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# ------------------------------------------------------------------------------
# GENERAL LOOK & FEEL
# ------------------------------------------------------------------------------
general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(f472b6ff) rgba(c084fcff) 45deg
    col.inactive_border = rgba(2552552550.15)
    layout = dwindle
    allow_tearing = false
}

# ------------------------------------------------------------------------------
# DECORATION & GLASSMORPHISM
# ------------------------------------------------------------------------------
decoration {
    rounding = 24
    
    active_opacity = 0.94
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0

    drop_shadow = true
    shadow_range = 20
    shadow_render_power = 3
    col.shadow = rgba(1921322520.35)
    col.shadow_inactive = rgba(00000000.2)

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }
}

# ------------------------------------------------------------------------------
# ANIMATIONS
# ------------------------------------------------------------------------------
animations {
    enabled = true

    bezier = yumeSpring, 0.13, 0.99, 0.29, 1.1
    bezier = yumeEase, 0.25, 1, 0.5, 1

    animation = windows, 1, 6, yumeSpring, slide
    animation = windowsOut, 1, 5, yumeEase, popin 80%
    animation = border, 1, 8, default
    animation = borderangle, 1, 8, default, loop
    animation = fade, 1, 6, yumeEase
    animation = workspaces, 1, 6, yumeSpring, slide
}

# ------------------------------------------------------------------------------
# LAYOUTS
# ------------------------------------------------------------------------------
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

gestures {
    workspace_swipe = true
}

# ------------------------------------------------------------------------------
# WINDOW RULES
# ------------------------------------------------------------------------------
windowrulev2 = float, class:^(yumemiro-welcome)$
windowrulev2 = center, class:^(yumemiro-welcome)$
windowrulev2 = size 900 620, class:^(yumemiro-welcome)$

windowrulev2 = float, class:^(yumemiro-theme)$
windowrulev2 = center, class:^(yumemiro-theme)$
windowrulev2 = size 800 550, class:^(yumemiro-theme)$

windowrulev2 = float, class:^(yumemiro-wallpaper)$
windowrulev2 = center, class:^(yumemiro-wallpaper)$
windowrulev2 = size 850 580, class:^(yumemiro-wallpaper)$

windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = opacity 0.92, class:^(kitty)$

# ------------------------------------------------------------------------------
# KEYBINDINGS
# ------------------------------------------------------------------------------
$mainMod = SUPER

bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, B, exec, firefox
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, rofi -show drun -theme ~/.config/rofi/theme.rasi
bind = $mainMod, D, exec, rofi -show drun -theme ~/.config/rofi/theme.rasi
bind = $mainMod, P, exec, /usr/local/bin/yumemiro-powermenu
bind = $mainMod, W, exec, python3 /usr/local/bin/yumemiro-welcome
bind = $mainMod, T, exec, python3 /usr/local/bin/yumemiro-theme
bind = $mainMod, S, exec, /usr/local/bin/yumemiro-screenshot
bind = , Print, exec, /usr/local/bin/yumemiro-screenshot

# Window Focus & Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mouse Binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
